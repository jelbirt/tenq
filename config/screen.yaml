# The daily screen (L6): code alone picks which stocks go to Jev and Opus each
# day. No model sees a stock the screen leaves out; it is recorded as "Hold by
# screen" and scored on prices like any other call, so the screen is judged too.
# Any edit here, even a comment, needs a new version.
version: screen-v7

# v7 (decided 2026-11-09): a stock passes when its next earnings release, by
# Yahoo's earnings list, falls in this many sessions after the screened one.
# Why: on prices from Dec 2024 to Oct 2026 (113 stocks, 454 days, each day's
# picks set against that day's other stocks, size of the next 20 sessions' move
# against QQQ), stocks with a release due in 5 sessions moved 11.3% against
# 9.6% for the rest, 1.77 points more, well past luck (0.97). Windows of 1, 3
# and 10 sessions gave much the same (1.6 to 1.8 points). Release dates for
# that test came from EDGAR (8-K item 2.02); the 8 foreign companies file no
# such item, so they were not tested, but Yahoo lists their dates and they are
# screened like the rest.
# The v6 reasons, a new filing (8-K, 6-K, 10-Q, 10-K, less routine filers) and
# a big move against QQQ (2.5 usual moves over 1 or 5 sessions), were dropped:
# on the same prices the stocks they picked moved no more than the rest
# (0.15 points less). Kept alongside earnings, they cut its gap to 0.56 points,
# passed 16 stocks on a typical day, and left no room for the random fill on 4
# days in 10.
earnings_sessions: 5

# Not a reason to pass (decided 2026-11-08): a recent Buy, Sell or Short from
# Jev or Opus. Each day's call is scored on its own 20 sessions whether or not
# the stock is asked again, so re-asking adds nothing to the scoring, and it
# feeds itself: an asked stock can get another call, which keeps it asked, until
# the same names fill the cap.

# At most this many go to the models a day. Past the cap, the soonest release
# first; stocks reporting on the same day in an order drawn at random (seeded
# by the day, so a rerun keeps the same ones). In the test above more than 25
# had a release due on 10% of days.
cap: 25

# Random fill (decided 2026-11-08): when fewer than this many pass, the rest of
# the slots up to it go to left-out stocks drawn at random (seeded by the day,
# so a rerun draws the same). They are a fair sample of what the screen skips,
# so the scorecard can show whether screened stocks give the models more to act
# on than random ones. On a typical day 5 stocks had a release due in the test
# above, so about 15 slots go to the fill; on 4% of days none did, and all 20
# are drawn at random.
fill_to: 20
