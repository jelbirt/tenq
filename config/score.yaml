# How the scorecard judges a call. Read top to bottom. Any edit, even to a
# comment, bumps the version (a test pins this file's hash for each version),
# and the version is written on every scored call, so a change can never
# quietly rescore the past. src/tenq/scorecard.py applies it.
version: score-v2

# 1. How long a call is held, in trading sessions. A call is entered at the
#    open of the first session that starts after the call was made (made_at in
#    the day's record), and left at the close of the 20th session, counting
#    the entry session. The stock's return over that span, less QQQ's over the
#    same span, is the call's excess return.
sessions: 20

# 2. What each call bets on that excess return. A call's score is its weight
#    times the excess return: a Buy gains what the stock beat QQQ by, a Short
#    gains what it lagged by. A Sell ("get out if owned") counts half a Short.
#    A Hold scores 0.
weights:
  Buy: 1.0
  Hold: 0.0
  Sell: -0.5
  Short: -1.0

# 3. The Sell weights the scorecard also shows each method's score under, so
#    the choice of 0.5 can be watched. Shown only, never used for the verdict.
sell_weights_shown: [0.25, 0.5, 1.0]

# 4. Jev against Opus, on the stocks and days both made a call. Every week
#    the card says who is ahead so far, however small the gap, and how big a
#    gap luck alone could give at this point (a 90% range around zero). That
#    range adds up every paired call's daily moves by calendar day, so the 20
#    sessions each call is held, calls that stick for weeks and stocks moving
#    together are each counted once; carry_days adds a short correction for
#    any carry-over from one day to the next.
#    The lead is "settled" only once weeks_first_verdict weeks are scored and
#    the gap is at least settled_bar standard errors. One 90% check would use
#    1.645, but the card is read every week, and every reading is another
#    chance for luck to look like a winner: with 1.645 a method with no edge
#    would be called the winner at some point in about a third of years.
#    2.4 keeps that to about 1 in 10 over weeks 13 to 100.
weeks_first_verdict: 13
settled_bar: 2.4
carry_days: 2

# 5. A stock whose prices have a gap on its entry or exit day (or no opening
#    price) while QQQ's go on is marked unscored once QQQ is no_price_after
#    sessions past the exit. A stock with no prices downloaded at all waits
#    much longer, no_download_after sessions, since one failed download looks
#    the same as a delisting.
no_price_after: 5
no_download_after: 60
