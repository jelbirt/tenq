name: trace-check

# One button that proves tracing works end to end: sends a small test trace
# to Langfuse, then looks it up by id through Langfuse's API. Green only if
# Langfuse stored it. Run it after changing any LANGFUSE_* secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --locked
      - name: send a test trace and look it up
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: uv run --locked python -m tenq.trace --check
