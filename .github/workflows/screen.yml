name: screen
# Manual only: print which stocks the daily screen would pass today, from
# Yahoo's earnings dates. Code only: no model is asked anything, nothing is
# emailed and nothing is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 113 Yahoo lookups, about a minute
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --locked
      - name: screen
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run --locked python -m tenq.screen --json screen.json
      - name: keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: screen, path: screen.json, if-no-files-found: ignore}
