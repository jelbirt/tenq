[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tenq"
version = "0.1.0"
description = "Personal stock analyst: cited filing briefs and daily calls on a software watchlist"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.62.1",
    "feedparser>=6.0",
    "langfuse>=5.2",
    "mcp>=2.3",
    "opentelemetry-sdk>=1.45",
    "pyyaml>=6.0",
    "yfinance>=1.8",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tenq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # parametrized data tables read better unwrapped

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# untyped: yfinance and feedparser ship no types; pandas is only a duck-typed frame
module = ["yfinance", "pandas", "feedparser"]
ignore_missing_imports = true
